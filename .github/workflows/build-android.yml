name: Build NUTRIO Android APK and AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"
      - "index.html"
      - "CSS/**"
      - "JS/**"
      - "icon*.svg"
      - "manifest.webmanifest"
      - "sw.js"
      - "scripts/generate-android-assets.js"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      NUTRIO_KEYSTORE_BASE64: ${{ secrets.NUTRIO_KEYSTORE_BASE64 }}
      NUTRIO_KEYSTORE_PASSWORD: ${{ secrets.NUTRIO_KEYSTORE_PASSWORD }}
      NUTRIO_KEY_ALIAS: ${{ secrets.NUTRIO_KEY_ALIAS }}
      NUTRIO_KEY_PASSWORD: ${{ secrets.NUTRIO_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install

      - name: Prepare bundled app files
        run: |
          mkdir -p www
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='www/' \
            --exclude='android/' \
            --exclude='android-wrapper/' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='supabase/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.json' \
            --exclude='README.md' \
            ./ www/

      - name: Add Android platform
        run: npx cap add android

      - name: Generate NUTRIO Android icon and store icon
        run: node scripts/generate-android-assets.js

      - name: Synchronize web assets
        run: npx cap sync android

      - name: Configure release signing
        if: env.NUTRIO_KEYSTORE_BASE64 != '' && env.NUTRIO_KEYSTORE_PASSWORD != '' && env.NUTRIO_KEY_ALIAS != '' && env.NUTRIO_KEY_PASSWORD != ''
        run: |
          echo "$NUTRIO_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()
          if "signingConfigs {" not in text:
              text = text.replace(
                  "android {",
                  """android {
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("NUTRIO_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("NUTRIO_KEY_ALIAS")
                      keyPassword System.getenv("NUTRIO_KEY_PASSWORD")
                  }
              }
          """,
                  1
              )
          pattern = r"(buildTypes\s*\{\s*release\s*\{)"
          if "signingConfig signingConfigs.release" not in text:
              text, count = re.subn(
                  pattern,
                  r"\1\n            signingConfig signingConfigs.release",
                  text,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not configure release signing in android/app/build.gradle")
          path.write_text(text)
          PY

      - name: Build Android test APK
        run: cd android && ./gradlew assembleDebug

      - name: Build signed release APK and Google Play AAB
        if: env.NUTRIO_KEYSTORE_BASE64 != '' && env.NUTRIO_KEYSTORE_PASSWORD != '' && env.NUTRIO_KEY_ALIAS != '' && env.NUTRIO_KEY_PASSWORD != ''
        run: cd android && ./gradlew assembleRelease bundleRelease

      - name: Remove temporary signing key
        if: always()
        run: rm -f android/app/release-key.jks

      - name: Upload Android builds and store icon
        uses: actions/upload-artifact@v4
        with:
          name: NUTRIO-android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            assets/nutrio-icon-512.png
          if-no-files-found: warn
          retention-days: 3

# Build release artifacts after signing secrets are configured.