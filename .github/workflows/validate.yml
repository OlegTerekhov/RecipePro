name: Validate RecipePro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate web app manifest
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); if (!m.name || !m.start_url || !m.scope || !Array.isArray(m.icons) || !m.icons.length) process.exit(1); console.log('Manifest is valid:', m.name);"

      - name: Validate required PWA files
        run: |
          test -f index.html
          test -f sw.js
          test -f manifest.webmanifest
          test -f icon.svg
          test -f CSS/style.css
          echo "PWA shell files exist."

      - name: Check JavaScript syntax
        run: |
          find JS -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js

      - name: Check app shell asset paths
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const paths = [
            ...[...html.matchAll(/(?:src|href)="((?:\.\/)?(?:JS|CSS)\/[^"?]+)(?:\?[^"]*)?"/g)].map(m => m[1]),
            ...[...sw.matchAll(/"((?:\.\/)?(?:JS|CSS)\/[^"]+)"/g)].map(m => m[1])
          ];
          const missing = [...new Set(paths)].filter(p => !fs.existsSync(p.replace(/^\.\//, '')));
          if (missing.length) {
            console.error('Missing local assets:', missing.join(', '));
            process.exit(1);
          }
          console.log('Checked local assets:', [...new Set(paths)].length);
          NODE
