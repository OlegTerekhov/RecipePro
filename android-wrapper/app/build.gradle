plugins {
    id 'com.android.application'
}

def releaseKeyFile = file('release-key.jks')
def hasReleaseKey = releaseKeyFile.exists() &&
        System.getenv('NUTRIO_KEYSTORE_PASSWORD') &&
        System.getenv('NUTRIO_KEY_ALIAS') &&
        System.getenv('NUTRIO_KEY_PASSWORD')

android {
    namespace 'ru.terekhov.nutrio'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.terekhov.nutrio'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile releaseKeyFile
                storePassword System.getenv('NUTRIO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NUTRIO_KEY_ALIAS')
                keyPassword System.getenv('NUTRIO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}
